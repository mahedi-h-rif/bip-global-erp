# One stack per client. Usage:
#   cp clients/nazmul-global.env.example clients/nazmul-global.env   # fill in the secrets
#   CLIENT=nazmul-global docker compose -p nazmul-global --env-file clients/nazmul-global.env up -d --build
# --env-file is what fills ${DB_PASSWORD} and ${FATOORA_WHATSAPP_TOKEN} below; env_file only reaches the api.
# Put a TLS-terminating reverse proxy (Caddy, Nginx, Cloudflare) in front of "web".
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: fatoora
      POSTGRES_USER: fatoora
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the client env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fatoora"]
      interval: 10s
      retries: 5

  api:
    build: ../backend
    restart: unless-stopped
    env_file: clients/${CLIENT:?set CLIENT}.env
    environment:
      DB_URL: jdbc:postgresql://db:5432/fatoora
      DB_USERNAME: fatoora
    depends_on:
      db:
        condition: service_healthy
      whatsapp:
        condition: service_started

  # Sends WhatsApp from the company's number, linked by QR (Settings → WhatsApp). Only the api talks to it.
  whatsapp:
    build: ../whatsapp
    restart: unless-stopped
    environment:
      WHATSAPP_TOKEN: ${FATOORA_WHATSAPP_TOKEN:-}
    volumes:
      - wa-auth:/data

  web:
    build:
      context: ../frontend
      args:
        API_ORIGIN: http://api:8080
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
  # The linked WhatsApp session: keep it, or the number has to be scanned again.
  wa-auth:
