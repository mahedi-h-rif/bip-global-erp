# SoudaCore ERP · BIP Gulf Logistics. One Postgres holding bip_uat and bip_prod; the app uses ${DB_NAME}.
# UAT = api/web on ${WEB_PORT} (bip_uat); production = api-prod/web-prod on ${WEB_PORT_PROD} (bip_prod). Both use ZATCA PRODUCTION.
#   docker compose -p bip-erp --env-file clients/bip-gulf.env up -d --build
# Put a TLS-terminating reverse proxy (Caddy) in front of "web" once a domain is mapped.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the client env file}
      ERP_DATABASES: bip_uat bip_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 10s
      retries: 5
    # Never published: only the api reaches it on the internal network.

  api:
    build: ../backend
    image: bip-erp-api:latest
    restart: unless-stopped
    env_file: clients/${CLIENT:-bip-gulf}.env
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:?set DB_NAME}
      DB_USERNAME: erp
    depends_on:
      db:
        condition: service_healthy

  # Sends WhatsApp from the company's number, linked by QR (Settings → WhatsApp). Only the api talks to it.
  # Turned off for now: it only starts with `--profile whatsapp`. To bring WhatsApp back, start it with that profile,
  # set FATOORA_WHATSAPP_URL in the client env, and build the frontend with NEXT_PUBLIC_WHATSAPP=on.
  whatsapp:
    profiles: ["whatsapp"]
    build: ../whatsapp
    restart: unless-stopped
    environment:
      WHATSAPP_TOKEN: ${FATOORA_WHATSAPP_TOKEN:-}
    volumes:
      - wa-auth:/data

  web:
    build:
      context: ../frontend
      args:
        API_ORIGIN: http://api:8080
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:3000"
    depends_on:
      - api

  # Production instance on the same server and Postgres, database bip_prod, its own logins and secrets.
  # Same image as api (built once): only its env and database differ.
  api-prod:
    image: bip-erp-api:latest
    restart: unless-stopped
    env_file: clients/bip-gulf-prod.env
    environment:
      DB_URL: jdbc:postgresql://db:5432/bip_prod
      DB_USERNAME: erp
    depends_on:
      db:
        condition: service_healthy

  web-prod:
    build:
      context: ../frontend
      args:
        API_ORIGIN: http://api-prod:8080
    restart: unless-stopped
    ports:
      - "${WEB_PORT_PROD:-8089}:3000"
    depends_on:
      - api-prod

  # HTTPS for erp.bipgulf.com (production), with automatic Let's Encrypt certificates.
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web-prod

volumes:
  pgdata:
  wa-auth:
  caddy-data:
  caddy-config:
